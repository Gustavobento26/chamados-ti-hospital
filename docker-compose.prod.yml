services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chamados_ti
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados -d chamados_ti"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://chamados:${POSTGRES_PASSWORD}@db:5432/chamados_ti
      SECRET_KEY: ${SECRET_KEY}
      APP_NAME: ${APP_NAME:-Chamados TI Hospital}
      COOKIE_SECURE: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
